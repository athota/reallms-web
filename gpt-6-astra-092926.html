  <div class="compatibility-note"><strong>What is verified—and what still needs your key.</strong><p>Current Codex uses the Responses protocol. The supplied IU KB documents Chat Completions but does not list <code>/responses</code>; that omission does not establish that the endpoint is disabled. Try the direct test below first. If unavailable, LiteLLM documents a local Responses-to-Chat-Completions bridge. These are vendor-documented configurations, not an authenticated REALLMS end-to-end test or an IU-published Codex recipe.</p></div>
  <h4 class="guide-step">1. Install Codex and verify your API key</h4><p class="panel-detail">Run the following, paste your personal key at the hidden prompt, and confirm that <code>Qwen3-Coder-Next</code> appears in the returned model list. If it does not, substitute an available text-generation model throughout this guide. Do not use an embedding or reranking model for Codex.</p>

  <h4 class="guide-step">2. Test the direct Responses endpoint</h4><p class="panel-detail">This is a capability probe, not a claim that IU documents this endpoint. A successful stream should include text deltas and a final <code>response.completed</code> event.</p>
  ${o("Bash / direct capability test","codex-probe")}
  <details class="guide-details"><summary>Direct test succeeded? Configure Codex without an adapter.</summary><p class="panel-detail">Merge these keys into your user-level file, avoiding duplicate TOML keys or tables. Create <code>~/.codex</code> and the file if needed. Provider settings belong in the user configuration, not your project’s <code>.codex/config.toml</code>. Then go to step 4.</p>${o("~/.codex/config.toml / direct connection","codex-direct")}</details>

  <p class="panel-detail">LiteLLM translates Responses requests into Chat Completions for its hosted-vLLM provider. The <code>hosted_vllm/</code> prefix selects the adapter; it is removed before the model ID is sent to IU. The adapter runs on your computer and handles prompts and keys locally; REALLMS service data-handling terms do not describe your local tools’ logs or storage.</p>
  ${o("Bash / install the adapter","codex-proxy-install")}
  ${o("reallms-proxy.yaml","codex-yaml")}
  ${o("Bash / start and test the adapter","codex-proxy-run")}
  <p class="panel-detail">Use the local proxy key for Codex; only the adapter uses your IU key. Keep the same shell open so both environment variables remain available. Merge the following into <code>~/.codex/config.toml</code>, replacing the direct provider selection if you used it earlier.</p>
  ${o("~/.codex/config.toml / local adapter","codex-proxy-config")}
  <h4 class="guide-step">4. Launch and verify a complete turn</h4><p class="panel-detail">Start Codex in your project directory. Test a plain-text answer, then a simple tool action and follow-up. A successful greeting alone does not verify tool calling. The chosen model and IU deployment must support the tool behavior used by your installed Codex version. Web search is disabled because this guide does not configure hosted OpenAI tools.</p>
  ${o("Bash / launch and check","codex-launch")}
  <details class="guide-details"><summary>Troubleshooting: keys, endpoints, and tools</summary><ul class="guide-troubleshooting"><li><strong>401 / 403:</strong> Verify your IU key and allocation with <code>GET /models</code>. For the adapter URL, use <code>REALLMS_PROXY_KEY</code>; for IU, use <code>REALLMS_API_KEY</code>.</li><li><strong>404 / 405 on direct Responses:</strong> Check the response body for an endpoint error. Use the adapter route if Responses is not exposed. A model-not-found error instead requires correcting the model ID.</li><li><strong>Connection refused on port 4000:</strong> Wait for LiteLLM startup or inspect its terminal error. Keep the proxy running.</li><li><strong>400 / unsupported parameter / tool error:</strong> Inspect the error and installed tool versions. A protocol bridge cannot add model capabilities. Test another available text model or share the redacted error with the REALLMS team.</li><li><strong>429:</strong> Reduce request volume and consult the <a href="${s.api}">API service guidance</a>.</li><li><strong>Codex uses the wrong provider:</strong> Check <code>model_provider</code>, the active user-level config, and command-line overrides. This setup uses API-key authentication, not ChatGPT sign-in.</li></ul></details>
